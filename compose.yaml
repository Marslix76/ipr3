services:
  app:
    build: .
    read_only: true
    mem_limit: 256m
    cpus: 1
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      GREETING: ${GREETING:-hi}
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - db:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 5
      interval: 5s
      timeout: 3s
volumes:
  db:
